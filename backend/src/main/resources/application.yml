spring:
  application:
    name: amorena-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/amorena}
    username: ${SPRING_DATASOURCE_USERNAME:amorena}
    password: ${SPRING_DATASOURCE_PASSWORD:CHANGE_ME_amorena_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_jwt_secret_minimo_256_bits_base64_ou_hex}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  upload:
    # TODO (FASE 2+): trocar para S3/Cloudinary quando necessário.
    # Por padrão, armazenamento local dentro do backend.
    dir: ./uploads
    public-url-base: ${SERVER_URL:http://localhost:8080/api}/public/uploads
